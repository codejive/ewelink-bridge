name: Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: ewelink-bridge

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js syntax
        run: |
          for file in *.js test/*.js; do node --check "$file"; done

      - name: Install NATS server for integration tests
        env:
          NATS_VERSION: '2.15.0'
        run: |
          curl --fail --location --retry 3 "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/nats-server-v${NATS_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/nats-server.tar.gz"
          tar -xzf "$RUNNER_TEMP/nats-server.tar.gz" -C "$RUNNER_TEMP"
          echo "NATS_SERVER_BINARY=$RUNNER_TEMP/nats-server-v${NATS_VERSION}-linux-amd64/nats-server" >> "$GITHUB_ENV"

      - name: Test configuration, buffering, and broker isolation
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:ci
